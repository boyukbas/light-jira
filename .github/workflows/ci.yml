name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Cancel in-progress CI runs for the same branch when new commits arrive — saves
# Actions minutes during force-push / rebase flurries.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        # Package.json currently has no lockfile requirement, so fall back to
        # `npm install` when `npm ci` can't find package-lock.json. Both paths
        # produce the same node_modules for the lint step.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Prettier / stylelint / class-usage
        run: npm run lint

  typecheck:
    name: JSDoc typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Install TypeScript for checkJs
        run: npm install --no-save typescript@5
      # tsconfig.json is configured with checkJs + noEmit — this is a static
      # check only, no files are generated.
      - name: Type-check
        continue-on-error: true
        run: npx tsc -p tsconfig.json

  test:
    name: Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
