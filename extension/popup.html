<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Crisp for Jira</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="logo">
        <!-- Crisp for Jira icon -->
        <svg width="14" height="14" viewBox="0 0 128 128" fill="none">
          <rect width="128" height="128" rx="24" fill="#0f172a" />
          <path
            d="M 69 43 A 30 30 0 1 0 69 85"
            fill="none"
            stroke="white"
            stroke-width="15"
            stroke-linecap="round"
          />
          <line
            x1="74"
            y1="53"
            x2="105"
            y2="53"
            stroke="white"
            stroke-width="7"
            stroke-linecap="round"
          />
          <circle cx="69" cy="43" r="7" fill="#fbbf24" />
        </svg>
        Crisp for Jira
      </span>
      <span id="app-status" class="status-badge">Checking…</span>
    </header>

    <!-- Quick-open: launch any ticket / JQL / filter from anywhere -->
    <div class="quick-open">
      <input
        id="quick-open-input"
        class="text-input"
        type="text"
        placeholder="Open ticket, JQL, or filter…"
        aria-label="Open a ticket key, JQL query, or filter in the app"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="quick-open-btn" class="btn primary" aria-label="Open in app">Open</button>
    </div>
    <ul
      id="quick-open-results"
      class="keys-list recent-list qo-results hidden"
      role="listbox"
      aria-label="Suggestions"
    ></ul>

    <main>
      <!-- Section A: Beam the current page URL (Jira pages only) -->
      <section id="section-url" class="hidden">
        <div class="section-label">Current Page</div>
        <div id="url-display" class="url-display"></div>
        <select id="beam-url-group" class="group-select hidden" aria-label="Target group"></select>
        <button id="beam-url-btn" class="btn primary">Beam to App</button>
      </section>

      <!-- Section B: Issue keys found on the current page (Jira pages only) -->
      <section id="section-keys" class="hidden">
        <div class="section-header">
          <div class="section-label">Tickets on This Page</div>
          <button id="select-all-link" type="button" class="link-btn">Select all</button>
        </div>
        <p id="keys-loading" class="muted">Scanning…</p>
        <ul id="keys-list" class="keys-list hidden"></ul>
        <div id="group-form" class="group-form hidden">
          <input id="group-name" class="text-input" placeholder="Group name…" maxlength="60" />
          <button id="beam-group-btn" class="btn primary">Beam Group</button>
        </div>
      </section>

      <!-- Recent tickets — one-click open, shown when not beaming a Jira page -->
      <section id="section-recent" class="hidden">
        <div class="section-label">Recent Tickets</div>
        <ul id="recent-list" class="keys-list recent-list"></ul>
      </section>

      <!-- Fallback hint when there is nothing else to show -->
      <section id="section-hint" class="hidden">
        <p class="muted">Open a Jira page to beam tickets, or search above to jump to one.</p>
      </section>
    </main>

    <!-- Inline feedback (beam results, errors) -->
    <div id="popup-msg" class="popup-msg hidden" role="status" aria-live="polite"></div>

    <footer>
      <button id="beam-all-btn" class="btn">Beam All Jira Tabs</button>
      <button id="open-app-btn" class="btn ghost">Open App</button>
    </footer>

    <script src="../lib/fuse.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
